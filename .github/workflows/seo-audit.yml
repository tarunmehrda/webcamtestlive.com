name: Twice-Daily Automated SEO & Seobility Audit

on:
  schedule:
    # 03:30 UTC is 9:00 AM IST (India Standard Time)
    - cron: '30 3 * * *'
    # 12:30 UTC is 6:00 PM IST (India Standard Time)
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: read

jobs:
  seo-health-audit:
    name: SEO & Seobility Health Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Run SEO & Seobility Audit Engine
        run: npm run seo:check

      - name: Verify Live Endpoints
        run: |
          node -e "
            const endpoints = [
              'https://webcamtestlive.com/',
              'https://webcamtestlive.com/embed',
              'https://webcamtestlive.com/speaker-test',
              'https://webcamtestlive.com/mac',
              'https://webcamtestlive.com/windows',
              'https://webcamtestlive.com/chromebook',
              'https://webcamtestlive.com/zoom',
              'https://webcamtestlive.com/mirror',
              'https://webcamtestlive.com/take-photo',
              'https://webcamtestlive.com/google-meet',
              'https://webcamtestlive.com/teams',
              'https://webcamtestlive.com/sitemap.xml',
              'https://webcamtestlive.com/robots.txt',
              'https://webcamtestlive.com/llms.txt'
            ];
            Promise.all(endpoints.map(async url => {
              const res = await fetch(url);
              console.log(url, '=>', res.status, res.statusText);
              if (!res.ok) throw new Error('Unhealthy status: ' + res.status);
            })).catch(err => {
              console.error(err);
              process.exit(1);
            });
          "

      - name: Upload SEO Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: dist/seo-audit-report.json
          retention-days: 30
