<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam &amp; Mic Test Live</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="logo-row">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 7l-7 5 7 5V7z"></path>
          <rect x="1" y="5" width="15" height="14" rx="3" ry="3"></rect>
        </svg>
      </div>
      <div>
        <h1 class="title">WebcamTestLive</h1>
        <p class="subtitle">Hardware &amp; Call Diagnostic Suite</p>
      </div>
    </div>
    <span class="badge">100% Private</span>
  </header>

  <main class="grid">
    <button class="tool-btn highlight" data-url="https://webcamtestlive.com">
      <span class="btn-icon">📷</span>
      <div class="btn-content">
        <strong>Webcam &amp; FPS Test</strong>
        <small>Sensor, resolution, framerate &amp; quality</small>
      </div>
    </button>

    <button class="tool-btn" data-url="https://webcamtestlive.com/mic-test">
      <span class="btn-icon">🎙️</span>
      <div class="btn-content">
        <strong>Mic &amp; Echo Playback</strong>
        <small>Waveform VU meter &amp; voice playback</small>
      </div>
    </button>

    <button class="tool-btn" data-url="https://webcamtestlive.com/video-recorder">
      <span class="btn-icon">🔴</span>
      <div class="btn-content">
        <strong>Online Video Recorder</strong>
        <small>Zero-watermark HD recording &amp; download</small>
      </div>
    </button>

    <button class="tool-btn" data-url="https://webcamtestlive.com/keyboard-test">
      <span class="btn-icon">⌨️</span>
      <div class="btn-content">
        <strong>Keyboard Tester</strong>
        <small>Full 104-key ghosting &amp; rollover test</small>
      </div>
    </button>

    <button class="tool-btn" data-url="https://webcamtestlive.com/screen-test">
      <span class="btn-icon">🖥️</span>
      <div class="btn-content">
        <strong>Screen &amp; Dead Pixel Test</strong>
        <small>Color check &amp; stuck pixel flasher</small>
      </div>
    </button>

    <button class="tool-btn" data-url="https://webcamtestlive.com/speaker-test">
      <span class="btn-icon">🔊</span>
      <div class="btn-content">
        <strong>Speaker Sound Test</strong>
        <small>Stereo L/R balance &amp; frequency sweep</small>
      </div>
    </button>

    <button class="tool-btn" data-url="https://webcamtestlive.com/mirror">
      <span class="btn-icon">🪞</span>
      <div class="btn-content">
        <strong>Camera Mirror</strong>
        <small>Lighting check &amp; posture check</small>
      </div>
    </button>
  </main>

  <footer class="footer">
    <a href="https://webcamtestlive.com" class="footer-link" target="_blank" rel="noopener">
      <span>Open Full Suite on Web</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
