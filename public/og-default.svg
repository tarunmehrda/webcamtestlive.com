<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="18%" cy="12%" r="58%">
      <stop offset="0%" stop-color="#007cf0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#007cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="88%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="78%" cy="92%" r="58%">
      <stop offset="0%" stop-color="#f9cb28" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f9cb28" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="12%" cy="88%" r="50%">
      <stop offset="0%" stop-color="#00dfd8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00dfd8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>
  <rect width="1200" height="630" fill="url(#g4)"/>

  <!-- wordmark -->
  <g transform="translate(80 72)">
    <rect x="0" y="0" width="52" height="52" rx="12" fill="#171717"/>
    <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(11 16)">
      <rect x="0" y="0" width="21" height="19" rx="4.5"/>
      <path d="m21 5 9-5v19l-9-5z"/>
    </g>
    <text x="70" y="35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="600"
          letter-spacing="-0.6" fill="#171717" textLength="188" lengthAdjust="spacing">Webcam Test</text>
  </g>

  <!-- headline -->
  <text x="80" y="330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="76" font-weight="600"
        letter-spacing="-3" fill="#171717" textLength="900" lengthAdjust="spacing">Test your webcam</text>
  <text x="80" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="76" font-weight="600"
        letter-spacing="-3" fill="#171717" textLength="560" lengthAdjust="spacing">in seconds.</text>

  <!-- subtitle -->
  <text x="80" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="400"
        fill="#4d4d4d" textLength="760" lengthAdjust="spacing">Resolution · frame rate · lighting · microphone</text>

  <!-- footer row -->
  <g transform="translate(80 540)">
    <rect x="0" y="0" width="232" height="40" rx="20" fill="#171717"/>
    <circle cx="24" cy="20" r="5" fill="#3ecf8e"/>
    <text x="40" y="26" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500"
          fill="#ffffff" textLength="172" lengthAdjust="spacing">100% private · no upload</text>
  </g>
  <text x="1120" y="566" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24"
        font-weight="500" fill="#171717" textLength="252" lengthAdjust="spacing">webcamtestlive.com</text>
</svg>
